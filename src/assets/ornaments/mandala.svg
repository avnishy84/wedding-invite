<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1">
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" stroke-width="1.5"/>
  <!-- Second ring -->
  <circle cx="100" cy="100" r="80"/>
  <!-- Third ring -->
  <circle cx="100" cy="100" r="60"/>
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="35"/>
  <!-- Centre circle -->
  <circle cx="100" cy="100" r="12" fill="currentColor" opacity="0.15" stroke-width="1.5"/>
  <!-- 8 petals between r=35 and r=80 -->
  <ellipse cx="100" cy="57" rx="8" ry="20" fill="currentColor" opacity="0.12" stroke-width="1"/>
  <ellipse cx="100" cy="57" rx="8" ry="20" transform="rotate(45 100 100)" fill="currentColor" opacity="0.12" stroke-width="1"/>
  <ellipse cx="100" cy="57" rx="8" ry="20" transform="rotate(90 100 100)" fill="currentColor" opacity="0.12" stroke-width="1"/>
  <ellipse cx="100" cy="57" rx="8" ry="20" transform="rotate(135 100 100)" fill="currentColor" opacity="0.12" stroke-width="1"/>
  <ellipse cx="100" cy="57" rx="8" ry="20" transform="rotate(180 100 100)" fill="currentColor" opacity="0.12" stroke-width="1"/>
  <ellipse cx="100" cy="57" rx="8" ry="20" transform="rotate(225 100 100)" fill="currentColor" opacity="0.12" stroke-width="1"/>
  <ellipse cx="100" cy="57" rx="8" ry="20" transform="rotate(270 100 100)" fill="currentColor" opacity="0.12" stroke-width="1"/>
  <ellipse cx="100" cy="57" rx="8" ry="20" transform="rotate(315 100 100)" fill="currentColor" opacity="0.12" stroke-width="1"/>
  <!-- 8 outer petal outlines -->
  <ellipse cx="100" cy="57" rx="8" ry="20"/>
  <ellipse cx="100" cy="57" rx="8" ry="20" transform="rotate(45 100 100)"/>
  <ellipse cx="100" cy="57" rx="8" ry="20" transform="rotate(90 100 100)"/>
  <ellipse cx="100" cy="57" rx="8" ry="20" transform="rotate(135 100 100)"/>
  <ellipse cx="100" cy="57" rx="8" ry="20" transform="rotate(180 100 100)"/>
  <ellipse cx="100" cy="57" rx="8" ry="20" transform="rotate(225 100 100)"/>
  <ellipse cx="100" cy="57" rx="8" ry="20" transform="rotate(270 100 100)"/>
  <ellipse cx="100" cy="57" rx="8" ry="20" transform="rotate(315 100 100)"/>
  <!-- 8 spoke lines -->
  <line x1="100" y1="5" x2="100" y2="35" stroke-width="2"/>
  <line x1="100" y1="5" x2="100" y2="35" transform="rotate(45 100 100)" stroke-width="2"/>
  <line x1="100" y1="5" x2="100" y2="35" transform="rotate(90 100 100)" stroke-width="2"/>
  <line x1="100" y1="5" x2="100" y2="35" transform="rotate(135 100 100)" stroke-width="2"/>
  <line x1="100" y1="5" x2="100" y2="35" transform="rotate(180 100 100)" stroke-width="2"/>
  <line x1="100" y1="5" x2="100" y2="35" transform="rotate(225 100 100)" stroke-width="2"/>
  <line x1="100" y1="5" x2="100" y2="35" transform="rotate(270 100 100)" stroke-width="2"/>
  <line x1="100" y1="5" x2="100" y2="35" transform="rotate(315 100 100)" stroke-width="2"/>
  <!-- 8 small diamonds on inner ring -->
  <path d="M 100 65 L 104 69 L 100 73 L 96 69 Z" fill="currentColor"/>
  <path d="M 100 65 L 104 69 L 100 73 L 96 69 Z" transform="rotate(45 100 100)" fill="currentColor"/>
  <path d="M 100 65 L 104 69 L 100 73 L 96 69 Z" transform="rotate(90 100 100)" fill="currentColor"/>
  <path d="M 100 65 L 104 69 L 100 73 L 96 69 Z" transform="rotate(135 100 100)" fill="currentColor"/>
  <path d="M 100 65 L 104 69 L 100 73 L 96 69 Z" transform="rotate(180 100 100)" fill="currentColor"/>
  <path d="M 100 65 L 104 69 L 100 73 L 96 69 Z" transform="rotate(225 100 100)" fill="currentColor"/>
  <path d="M 100 65 L 104 69 L 100 73 L 96 69 Z" transform="rotate(270 100 100)" fill="currentColor"/>
  <path d="M 100 65 L 104 69 L 100 73 L 96 69 Z" transform="rotate(315 100 100)" fill="currentColor"/>
</svg>
